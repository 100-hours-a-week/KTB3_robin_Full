<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${book.title}">도서 상세</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        .container { max-width: 800px; margin: 24px auto; line-height: 1.6; }
        h1 { margin-bottom: 8px; }
        .meta { color: #555; margin-bottom: 16px; }
        dt { font-weight: bold; margin-top: 12px; }
        dd { margin: 4px 0 12px 0; }
        a { color: #0d6efd; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${book.title}">제목</h1>

    <div class="meta">
        저자: <span th:text="${book.author}">저자</span>
    </div>

    <dl>
        <dt>ISBN</dt>
        <dd th:text="${book.isbn}">0000000000000</dd>

        <dt>설명</dt>
        <dd th:text="${book.description}">설명 텍스트</dd>
    </dl>

    <p>
        <a th:href="@{/books}">목록으로 돌아가기</a>
    </p>
</div>
</body>
</html>
