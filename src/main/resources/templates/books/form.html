<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>새 도서 등록</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        form { max-width: 720px; margin: 16px 0; }
        label { display: block; margin: 8px 0 4px; font-weight: 600; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { min-height: 140px; resize: vertical; }
        .actions { margin-top: 12px; }
        .actions a { margin-left: 8px; }
    </style>
</head>
<body>
<h1>새 도서 등록</h1>

<form th:action="@{/books}" method="post" th:object="${bookDto}">
    <label for="title">제목</label>
    <input id="title" type="text" th:field="*{title}" placeholder="예) 이펙티브 자바" />

    <label for="author">저자</label>
    <input id="author" type="text" th:field="*{author}" placeholder="예) 조슈아 블로크" />

    <label for="isbn">ISBN</label>
    <input id="isbn" type="text" th:field="*{isbn}" placeholder="예) 9791162240000" />

    <label for="description">소개</label>
    <textarea id="description" th:field="*{description}" placeholder="도서 소개를 입력하세요."></textarea>

    <div class="actions">
        <button type="submit">저장</button>
        <a th:href="@{/books}">취소</a>
    </div>
</form>

</body>
</html>
